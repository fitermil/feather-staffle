<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feather Staffle</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --border-color: #2f2f37;
            --text-color: #ffffff;
            --text-muted: #a1a1aa;
            --input-bg: #27272a;
            --correct-color: #15803d;
            --wrong-color: #b91c1c;
            --accent-color: #3b82f6;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.5rem;
        }

        .day-counter {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
            position: relative;
        }

        .guess-counter {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .guess-counter.warning {
            color: #f59e0b;
            font-weight: bold;
        }

        .guess-counter.critical {
            color: var(--wrong-color);
            font-weight: bold;
        }

        input {
            padding: 12px 16px;
            font-size: 16px;
            width: 250px;
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .share-btn {
            background-color: #10b981;
            margin-top: 15px;
            display: inline-block;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: separate;
            border-spacing: 6px;
        }

        th,
        td {
            padding: 14px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            background-color: var(--container-bg);
        }

        th {
            background-color: transparent;
            color: var(--text-muted);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .correct {
            background-color: var(--correct-color);
            color: white;
        }

        .wrong {
            background-color: var(--wrong-color);
            color: white;
        }

        #endMessage {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Feather Staffle</h1>
    <div class="day-counter" id="dayCounter">Day #1</div>

    <div class="controls">
        <input id="guessInput" placeholder="Enter a name" list="staffOptions" autocomplete="off" />
        <datalist id="staffOptions"></datalist>
        <button id="submitBtn" onclick="handleGuess()">Submit</button>
    </div>
    <div class="guess-counter" id="guessCounter">6 guesses remaining</div>

    <div id="endMessage" style="display: none;"></div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Rank</th>
                <th>Year Joined</th>
                <th>Month Joined</th>
                <th>Has Reinstated?</th>
            </tr>
        </thead>
        <tbody id="results"></tbody>
    </table>

    <script>
        const DATA_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTMrGB2GLfTWfKlWLGvvUns0FFHMoiXtzTqJHPnF-vD1J3owNoxYRCRDMKO1yHqXaOdYAzwAdxNJXmM/pub?gid=0&single=true&output=csv";
        const ANSWERS_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTMrGB2GLfTWfKlWLGvvUns0FFHMoiXtzTqJHPnF-vD1J3owNoxYRCRDMKO1yHqXaOdYAzwAdxNJXmM/pub?gid=1516262193&single=true&output=csv";

        const LAUNCH_DATE = new Date("2026-05-16");

        // Define Rank order hierarchy (index 0 is highest rank)
        const RANK_ORDER = ["Manager", "Senior Admin", "Admin", "Senior Mod", "Mod", "Helper"];

        let DATA = [];
        let DAILY_ANSWERS = {};
        let ANSWER = null;
        let guesses = [];
        let currentDayNum = 1;

        const submitBtn = document.getElementById("submitBtn");
        const guessInput = document.getElementById("guessInput");
        const dayCounter = document.getElementById("dayCounter");
        const guessCounter = document.getElementById("guessCounter");
        const endMessage = document.getElementById("endMessage");
        const datalist = document.getElementById("staffOptions");

        const todayStr = new Date().toLocaleDateString('en-CA');
        const todayKey = "dailyGuess_" + todayStr;

        function updateDayCounter() {
            const todayDate = new Date(todayStr);
            const timeDiff = todayDate.getTime() - LAUNCH_DATE.getTime();
            currentDayNum = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1;
            dayCounter.textContent = `Day #${currentDayNum > 0 ? currentDayNum : 1}`;
        }

        function updateRemainingGuesses() {
            const left = 6 - guesses.length;
            guessCounter.textContent = `${left} guess${left !== 1 ? 'es' : ''} remaining`;
            
            guessCounter.className = "guess-counter";
            if (left === 2) guessCounter.classList.add("warning");
            if (left === 1) guessCounter.classList.add("critical");
        }

        guessInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !submitBtn.disabled) {
                handleGuess();
            }
        });

        window.addEventListener("keydown", function (e) {
            if (e.altKey && (e.key === "r" || e.key === "R")) {
                e.preventDefault();
                resetProgress();
            }
        });

        function resetProgress() {
            localStorage.removeItem(todayKey);
            guesses = [];
            document.getElementById("results").innerHTML = "";
            endMessage.style.display = "none";
            guessInput.disabled = false;
            guessInput.value = "";
            submitBtn.disabled = !canPlayToday();
            updateRemainingGuesses();
            alert("Progress reset!");
        }

        function cleanCSVLines(text) {
            return text.replace(/\r/g, "").trim().split("\n");
        }

        Promise.all([
            fetch(DATA_SHEET_URL).then(res => { if (!res.ok) throw new Error("Data sheet failed"); return res.text(); }),
            fetch(ANSWERS_SHEET_URL).then(res => { if (!res.ok) throw new Error("Answers sheet failed"); return res.text(); })
        ])
            .then(([dataCsv, answersCsv]) => {
                const dataLines = cleanCSVLines(dataCsv);
                DATA = dataLines.slice(1).map(line => {
                    const values = line.split(",");
                    return {
                        name: values[0]?.trim() ?? "",
                        status: values[1]?.trim() ?? "",
                        rank: values[2]?.trim() ?? "",
                        year: values[3]?.trim() ?? "",
                        month: values[4]?.trim() ?? "",
                        reinstate: values[5]?.trim() ?? ""
                    };
                }).filter(x => x.name !== "");

                datalist.innerHTML = "";
                DATA.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.name;
                    datalist.appendChild(option);
                });

                const answerLines = cleanCSVLines(answersCsv);
                DAILY_ANSWERS = {};
                answerLines.slice(1).forEach(line => {
                    const values = line.split(",");
                    const dateKey = values[0]?.trim();
                    const nameValue = values[1]?.trim();
                    if (dateKey && nameValue) {
                        DAILY_ANSWERS[dateKey] = nameValue;
                    }
                });

                ANSWER = getDailyAnswer(DATA);
                updateDayCounter();
                loadProgress();

                if (!ANSWER) {
                    endMessage.innerHTML = `<div>⚠️ No daily challenge configured for today's date (${todayStr}).</div>`;
                    endMessage.style.display = "block";
                    submitBtn.disabled = true;
                    guessInput.disabled = true;
                } else {
                    submitBtn.disabled = !canPlayToday();
                }
            })
            .catch(err => {
                console.error("Initialization Error:", err);
                alert("Failed to load spreadsheet assets. Verify your URLs and Publish settings.");
            });

        function getDailyAnswer(data) {
            const name = DAILY_ANSWERS[todayStr];
            if (!name) return null;
            return data.find(x => x.name.toLowerCase() === name.toLowerCase());
        }

        function loadProgress() {
            const savedProgress = JSON.parse(localStorage.getItem(todayKey) || "[]");
            guesses = savedProgress.slice();
            guesses.forEach(g => renderResult(g));
            updateRemainingGuesses();

            if (guesses.some(g => g.name.toLowerCase() === ANSWER?.name.toLowerCase())) {
                showEndScreen(true);
            } else if (guesses.length >= 6) {
                showEndScreen(false);
            }
        }

        function canPlayToday() {
            if (!ANSWER) return false;
            if (guesses.some(g => g.name.toLowerCase() === ANSWER.name.toLowerCase())) return false;
            return guesses.length < 6;
        }

        function handleGuess() {
            if (!ANSWER || !canPlayToday()) return;

            const input = guessInput.value.trim();
            if (!input) return alert("Please enter a name.");

            const guess = DATA.find(x => x.name.toLowerCase() === input.toLowerCase());
            if (!guess) return alert("Name not found in dataset.");

            if (guesses.some(g => g.name.toLowerCase() === guess.name.toLowerCase())) {
                return alert("You already guessed that person!");
            }

            guesses.push(guess);
            localStorage.setItem(todayKey, JSON.stringify(guesses));

            renderResult(guess);
            updateRemainingGuesses();
            guessInput.value = "";

            if (guess.name.toLowerCase() === ANSWER.name.toLowerCase()) {
                showEndScreen(true);
            } else if (guesses.length >= 6) {
                showEndScreen(false);
            }
        }

        // Helper to turn month inputs into standard integers
        function parseMonth(monthVal) {
            const num = parseInt(monthVal);
            if (!isNaN(num)) return num;
            
            const monthsShort = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
            const cleanStr = monthVal.toLowerCase().substring(0, 3);
            return monthsShort.indexOf(cleanStr) + 1; 
        }

        function renderResult(guess) {
            const tbody = document.getElementById("results");
            const tr = document.createElement("tr");

            const nameCell = document.createElement("td");
            nameCell.textContent = guess.name;
            nameCell.classList.add(ANSWER.name.toLowerCase() === guess.name.toLowerCase() ? "correct" : "wrong");
            tr.appendChild(nameCell);

            ["status", "rank", "year", "month", "reinstate"].forEach(key => {
                const td = document.createElement("td");
                let text = guess[key];

                // Year Direction Logic
                if (key === "year") {
                    const guessNum = parseInt(guess[key]);
                    const answerNum = parseInt(ANSWER[key]);
                    if (!isNaN(guessNum) && !isNaN(answerNum)) {
                        if (guessNum < answerNum) text += " ⬆️";
                        else if (guessNum > answerNum) text += " ⬇️";
                    }
                }

                // Month Direction Logic
                if (key === "month") {
                    const guessMon = parseMonth(guess[key]);
                    const answerMon = parseMonth(ANSWER[key]);
                    if (guessMon > 0 && answerMon > 0) {
                        if (guessMon < answerMon) text += " ⬆️";
                        else if (guessMon > answerMon) text += " ⬇️";
                    }
                }

                // Rank Direction Logic (Lower index in RANK_ORDER means a higher tier position)
                if (key === "rank") {
                    const guessIdx = RANK_ORDER.findIndex(r => r.toLowerCase() === guess[key].toLowerCase());
                    const answerIdx = RANK_ORDER.findIndex(r => r.toLowerCase() === ANSWER[key].toLowerCase());
                    if (guessIdx !== -1 && answerIdx !== -1) {
                        if (guessIdx > answerIdx) text += " ⬆️"; // Target rank index is smaller (higher up array)
                        else if (guessIdx < answerIdx) text += " ⬇️"; // Target rank index is larger (further down array)
                    }
                }

                td.textContent = text;
                td.classList.add(ANSWER[key].toLowerCase() === guess[key].toLowerCase() ? "correct" : "wrong");
                tr.appendChild(td);
            });

            tbody.insertBefore(tr, tbody.firstChild);
        }

        function generateShareGrid() {
            let gridText = `Feather Staffle Day #` + currentDayNum + ` (${guesses.length}/6)\n`;
            
            // Generate rows grid chronologically
            guesses.forEach(guess => {
                let rowEmojis = "";
                
                // Name check
                rowEmojis += (guess.name.toLowerCase() === ANSWER.name.toLowerCase()) ? "🟩" : "🟥";
                
                // Other attributes check
                ["status", "rank", "year", "month", "reinstate"].forEach(key => {
                    rowEmojis += (guess[key].toLowerCase() === ANSWER[key].toLowerCase()) ? "🟩" : "🟥";
                });
                gridText += rowEmojis + "\n";
            });
            
            navigator.clipboard.writeText(gridText).then(() => {
                alert("Results copied to your clipboard!");
            }).catch(err => {
                alert("Failed to copy results automatically.");
            });
        }

        function showEndScreen(correct) {
            let messageHtml = "";
            if (correct) {
                messageHtml = `<div>🎉 Correct! You got it in ${guesses.length} guess${guesses.length > 1 ? "es" : ""}.</div>`;
                endMessage.style.borderColor = varToString('--correct-color');
            } else {
                messageHtml = `<div>❌ All guesses used! The answer was: ${ANSWER.name}</div>`;
                endMessage.style.borderColor = varToString('--wrong-color');
            }

            messageHtml += `<button class="share-btn" onclick="generateShareGrid()">Copy Shareable Grid</button>`;
            endMessage.innerHTML = messageHtml;
            endMessage.style.display = "block";
            
            submitBtn.disabled = true;
            guessInput.disabled = true;
        }

        function varToString(varName) {
            return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        }
    </script>
</body>

</html>
